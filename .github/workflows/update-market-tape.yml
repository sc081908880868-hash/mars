name: Update market tape

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 1-5"
      timezone: "Asia/Jakarta"

permissions:
  contents: write

concurrency:
  group: update-market-tape
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch IDX closing prices
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: node scripts/update-market-tape.mjs
      - name: Publish changed tape
        run: |
          if git diff --quiet -- market-tape.json dist/market-tape.json; then
            echo "No new closing prices"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-tape.json dist/market-tape.json
          git commit -m "Update IDX closing tape"
          git push
